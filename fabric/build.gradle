plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = 'Isxander'
        url = 'https://maven.isxander.dev/releases'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Since 26.1 the game ships unobfuscated: no mappings, no mod remapping
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // YACL
    implementation "dev.isxander:yet-another-config-lib:${yacl_version}-fabric"

    // ModMenu (optional, for config screen access)
    implementation("com.terraformersmc:modmenu:${modmenu_version}") {
        transitive = false
    }

    // Test-environment mods, dev runtime only: rendering/graphics mods that
    // touch systems adjacent to ours (Sodium is required by Voxy and
    // replaces the fluid renderer entirely).
    // Voxy and Atmospherics publish the same version number for several MC
    // targets: their Modrinth version IDs pin the 26.1.2 files.
    // Sodium pinned to 0.9.1 stable: Voxy 0.2.18 requires exactly 0.9.1.
    // Both temporarily off to isolate the fluid-renderer bypass (Sodium
    // meshes fluids itself, skipping the vanilla FluidRenderer hooks).
    // runtimeOnly 'maven.modrinth:sodium:mc26.1.2-0.9.1-fabric'
    // runtimeOnly 'maven.modrinth:voxy:Zt3LPI0b'
    runtimeOnly 'maven.modrinth:polytone:26.1.2-6.2.2'
    runtimeOnly 'maven.modrinth:lambdynamiclights:4.11.0+26.1.2'
    runtimeOnly 'maven.modrinth:atmospherics:LeQKXuNM'
    runtimeOnly 'maven.modrinth:big-water:1.2.0-fabric+mc26.1'
    runtimeOnly 'maven.modrinth:glowtone:1.0.2-mc26.1'
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
