name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }}

      - name: Changelog
        run: |
          BASE_VERSION="${{ steps.version.outputs.version }}"
          BASE_VERSION="${BASE_VERSION%%+*}"
          FILE="changelogs/${BASE_VERSION}.md"
          if [ ! -f "$FILE" ]; then
            echo "::error::Missing ${FILE} — every release ships a hand-written changelog."
            exit 1
          fi
          cp "$FILE" changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: changelog.txt
          files: |
            fabric/build/libs/more_darkness-fabric-*[0-9].jar
            neoforge/build/libs/more_darkness-neoforge-*[0-9].jar

      - name: Publish Fabric to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/more_darkness-fabric-*[0-9].jar
          name: More Darkness ${{ steps.version.outputs.version }} (Fabric)
          version: ${{ steps.version.outputs.version }}+fabric
          version-type: release
          loaders: fabric
          game-versions: 1.21.1
          changelog-file: changelog.txt
          dependencies: |
            fabric-api(required)
            yacl(required)
            modmenu(optional)

      - name: Publish NeoForge to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/more_darkness-neoforge-*[0-9].jar
          name: More Darkness ${{ steps.version.outputs.version }} (NeoForge)
          version: ${{ steps.version.outputs.version }}+neoforge
          version-type: release
          loaders: neoforge
          game-versions: 1.21.1
          changelog-file: changelog.txt
          dependencies: |
            yacl(required)
